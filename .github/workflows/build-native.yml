name: Build KrispyClient Native

on:
  workflow_dispatch:

jobs:
  build-native:
    name: Build Android ARM64 Native Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"

      - name: Build native library
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          mkdir -p build/arm64-v8a

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-linux-android28 \
            -shared \
            -fPIC \
            -O2 \
            -o build/arm64-v8a/libkrispyclient.so \
            native/krispyclient.cpp

      - name: Verify library
        run: |
          file build/arm64-v8a/libkrispyclient.so

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: krispyclient-native-arm64
          path: build/arm64-v8a/libkrispyclient.so
