name: Build KrispyClient Native

on:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools" "ndk;27.2.12479018"

      - name: Build ARM64 native library
        run: |
          export NDK="$ANDROID_HOME/ndk/27.2.12479018"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p build/arm64-v8a

          "$TOOLCHAIN/clang++" \
            --target=aarch64-linux-android28 \
            -shared \
            -fPIC \
            -O2 \
            -std=c++17 \
            native/KrispyClient.cpp \
            -o build/arm64-v8a/libkrispyclient.so \
            -llog \
            -landroid \
            -lEGL \
            -lGLESv3

      - name: Verify native library
        run: |
          ls -lh build/arm64-v8a/

          file build/arm64-v8a/libkrispyclient.so

          readelf -h build/arm64-v8a/libkrispyclient.so

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: krispyclient-native-arm64
          path: build/arm64-v8a/libkrispyclient.so
          if-no-files-found: error
