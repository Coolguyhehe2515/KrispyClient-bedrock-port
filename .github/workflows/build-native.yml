name: Build KrispyClient Native

on:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools" "ndk;27.2.12479018"

      - name: Build ARM64 native library
        run: |
          export NDK="$ANDROID_HOME/ndk/27.2.12479018"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p build/arm64-v8a

          "$TOOLCHAIN/clang++" \
            --target=aarch64-linux-android28 \
            --sysroot="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -shared \
            -fPIC \
            -O2 \
            -std=c++17 \
            native/krispyclient.cpp \
            -o build/arm64-v8a/libkrispyclient.so \
            -landroid \
            -lEGL \
            -lGLESv3 \
            -llog

      - name: Verify library dependencies
        run: |
          export NDK="$ANDROID_HOME/ndk/27.2.12479018"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$TOOLCHAIN/llvm-readelf" \
            -d build/arm64-v8a/libkrispyclient.so

          "$TOOLCHAIN/llvm-readelf" \
            -Ws build/arm64-v8a/libkrispyclient.so | \
            grep -E "ANativeWindow_release|ANativeWindow_fromSurface|eglGetDisplay|eglInitialize|__android_log_print"

      - name: Check library architecture
        run: |
          file build/arm64-v8a/libkrispyclient.so

      - name: Copy libc++ shared library
        run: |
          export NDK="$ANDROID_HOME/ndk/27.2.12479018"

          cp \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            build/arm64-v8a/libc++_shared.so

      - name: List output
        run: |
          ls -lh build/arm64-v8a/

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: krispyclient-native-arm64
          path: build/arm64-v8a/
          if-no-files-found: error
