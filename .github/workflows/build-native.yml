name: Build KrispyClient Native

on:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: |
            tools
            platform-tools
            platforms;android-28
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Verify Android SDK and NDK
        shell: bash
        run: |
          set -e

          export NDK="$ANDROID_HOME/ndk/27.2.12479018"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=$NDK"
          echo "TOOLCHAIN=$TOOLCHAIN"

          echo "=== Android SDK ==="
          ls -la "$ANDROID_HOME"

          echo "=== NDK ==="
          test -d "$NDK"
          ls -la "$NDK"

          echo "=== Clang ==="
          test -f "$TOOLCHAIN/clang++"
          "$TOOLCHAIN/clang++" --version

      - name: Check source file
        shell: bash
        run: |
          set -e

          echo "=== Native source ==="

          test -f native/krispyclient.cpp

          ls -lh native/krispyclient.cpp

          echo "Source file found."

      - name: Build ARM64 native library
        shell: bash
        run: |
          set -e

          export NDK="$ANDROID_HOME/ndk/27.2.12479018"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p build/arm64-v8a

          echo "=== Building libkrispyclient.so ==="

          "$TOOLCHAIN/clang++" \
            --target=aarch64-linux-android28 \
            -shared \
            -fPIC \
            -O2 \
            -std=c++17 \
            native/krispyclient.cpp \
            -o build/arm64-v8a/libkrispyclient.so \
            -landroid \
            -llog \
            -lEGL \
            -lGLESv3

          echo "Build completed."

      - name: Copy libc++ shared library
        shell: bash
        run: |
          set -e

          export NDK="$ANDROID_HOME/ndk/27.2.12479018"

          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          test -f "$LIBCXX"

          cp \
            "$LIBCXX" \
            build/arm64-v8a/libc++_shared.so

          echo "libc++_shared.so copied."

      - name: Verify libraries
        shell: bash
        run: |
          set -e

          echo "=== Generated libraries ==="
          ls -lh build/arm64-v8a/

          echo
          echo "=== File information ==="
          file build/arm64-v8a/*.so

          echo
          echo "=== ELF information ==="
          readelf -h build/arm64-v8a/libkrispyclient.so

          echo
          echo "=== Architecture check ==="

          readelf -h build/arm64-v8a/libkrispyclient.so | grep -E \
            "Class:|Machine:|Type:"

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: krispyclient-native-arm64
          path: build/arm64-v8a/
          if-no-files-found: error
