name: Build KrispyClient Native

on:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          echo "sdkmanager=$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "=== Installing required packages ==="

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Verify Android NDK
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          echo "=== NDK ==="
          echo "NDK=$NDK"

          test -d "$NDK"

          cat "$NDK/source.properties"

          echo
          echo "=== LLVM ==="

          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          test -f "$CLANG"

          "$CLANG" --version

      - name: Verify native source
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          pwd

          echo
          echo "=== Native directory ==="

          if [ ! -d native ]; then
            echo "ERROR: native directory does not exist."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          ls -la native

          echo
          echo "=== Source ==="

          test -f native/krispyclient.cpp

          wc -l native/krispyclient.cpp

      - name: Build ARM64 native library
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p build/arm64-v8a

          echo "======================================"
          echo "Building KrispyClient"
          echo "======================================"

          "$TOOLCHAIN/clang++" \
            --target=aarch64-linux-android28 \
            -shared \
            -fPIC \
            -O2 \
            -std=c++17 \
            native/krispyclient.cpp \
            -o build/arm64-v8a/libkrispyclient.so \
            -landroid \
            -llog \
            -lEGL \
            -lGLESv3

          echo
          echo "BUILD SUCCESS"

      - name: Copy libc++ shared library
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          test -f "$LIBCXX"

          cp \
            "$LIBCXX" \
            build/arm64-v8a/libc++_shared.so

      - name: Verify output
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Generated libraries"
          echo "======================================"

          ls -lh build/arm64-v8a/

          echo
          echo "======================================"
          echo "File type"
          echo "======================================"

          file build/arm64-v8a/*.so

          echo
          echo "======================================"
          echo "ELF"
          echo "======================================"

          readelf -h build/arm64-v8a/libkrispyclient.so

          echo
          echo "======================================"
          echo "Architecture"
          echo "======================================"

          readelf -h build/arm64-v8a/libkrispyclient.so | \
            grep -E "Class:|Machine:|Type:"

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: krispyclient-native-arm64
          path: build/arm64-v8a/
          if-no-files-found: error
