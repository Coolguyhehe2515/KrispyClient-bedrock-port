name: Build KrispyClient Native

on:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: 27.2.12479018
      API_LEVEL: 28

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      - name: Locate SDK tools
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Check preinstalled NDK
        shell: bash
        run: |
          set -euxo pipefail

          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ -d "$NDK" ]; then
            echo "NDK already exists:"
            echo "$NDK"
            echo "NDK_FOUND=true" >> "$GITHUB_ENV"
          else
            echo "NDK is not preinstalled."
            echo "NDK_FOUND=false" >> "$GITHUB_ENV"
          fi

      - name: Install Android SDK packages
        if: env.NDK_FOUND != 'true'
        shell: bash
        run: |
          set -euxo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-$API_LEVEL" \
            "build-tools;35.0.0"

      - name: Install NDK
        if: env.NDK_FOUND != 'true'
        shell: bash
        run: |
          set -euxo pipefail

          echo "Installing NDK $NDK_VERSION"

          "$SDKMANAGER" \
            --install \
            "ndk;$NDK_VERSION"

      - name: Verify Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo
          echo "Installed SDK packages:"
          "$SDKMANAGER" --list_installed || true

          echo
          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"

          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"

          test -d "$NDK"

          echo "NDK=$NDK"

          test -x \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --version

          echo
          echo "========================================"
          echo "ANDROID PLATFORM"
          echo "========================================"

          test -d "$ANDROID_HOME/platforms/android-$API_LEVEL"

          echo "Android API $API_LEVEL found."

      - name: Check native source
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking native source..."

          test -f native/krispyclient.cpp

          echo "Source found:"
          ls -lh native/krispyclient.cpp

      - name: Build ARM64 native library
        shell: bash
        run: |
          set -euxo pipefail

          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p build/arm64-v8a

          echo "========================================"
          echo "BUILDING KRISPYCLIENT"
          echo "========================================"

          "$TOOLCHAIN/clang++" \
            --target=aarch64-linux-android$API_LEVEL \
            -shared \
            -fPIC \
            -O2 \
            -std=c++17 \
            native/krispyclient.cpp \
            -o build/arm64-v8a/libkrispyclient.so \
            -landroid \
            -llog \
            -lEGL \
            -lGLESv3

      - name: Copy libc++ shared library
        shell: bash
        run: |
          set -euxo pipefail

          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"

          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          test -f "$LIBCXX"

          cp \
            "$LIBCXX" \
            build/arm64-v8a/libc++_shared.so

      - name: Verify generated libraries
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "GENERATED FILES"
          echo "========================================"

          ls -lah build/arm64-v8a/

          echo
          echo "========================================"
          echo "FILE INFORMATION"
          echo "========================================"

          file build/arm64-v8a/*.so

          echo
          echo "========================================"
          echo "ELF INFORMATION"
          echo "========================================"

          readelf -h \
            build/arm64-v8a/libkrispyclient.so

          echo
          echo "========================================"
          echo "ARCHITECTURE CHECK"
          echo "========================================"

          readelf -h \
            build/arm64-v8a/libkrispyclient.so \
            | grep -E "Class|Machine|Type"

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: krispyclient-native-arm64
          path: build/arm64-v8a/
          if-no-files-found: error
